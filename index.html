<!DOCTYPE html>

<style>
  :root{
    --bg:#f4f6f8; --surface:#ffffff; --surface-2:#fafbfc;
    --border:#e3e6ea; --border-strong:#d3d8de;
    --text:#171a1f; --text-2:#5a616b; --text-3:#868d97;
    --accent:#2563eb; --accent-weak:#eef3ff;
    --radius:10px; --radius-sm:7px;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 8px 24px rgba(16,24,40,.06);
    --st-recv-bg:#eef3ff; --st-recv-tx:#1d4ed8;
    --st-proc-bg:#fff5e4; --st-proc-tx:#b45309;
    --st-done-bg:#e6f6ec; --st-done-tx:#137a4b;
    --st-fail-bg:#fdecec; --st-fail-tx:#c0362c;
    --st-recheck-bg:#feeee4; --st-recheck-tx:#c2410c;
    --st-cancel-bg:#eef0f2; --st-cancel-tx:#6b7280;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; cursor:pointer}
  h1,h2,h3,h4,p{margin:0}

  .appbar{height:56px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:28px; padding:0 22px; position:sticky; top:0; z-index:20}
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; letter-spacing:-.2px}
  .brand .logo{width:26px; height:26px; border-radius:7px; background:linear-gradient(135deg,#2563eb,#0f766e); display:grid; place-items:center; color:#fff; font-size:13px; font-weight:800}
  .brand .sub{font-weight:500; color:var(--text-3); font-size:12px; padding:2px 7px; border:1px solid var(--border); border-radius:20px}
  .tabs{display:flex; gap:4px; height:100%}
  .tab{border:0; background:transparent; height:100%; padding:0 15px; font-size:14px; font-weight:600; color:var(--text-2); display:flex; align-items:center; gap:8px; border-bottom:2px solid transparent; letter-spacing:-.2px}
  .tab .dot{width:8px; height:8px; border-radius:50%}
  .tab[data-t="edms"] .dot{background:#2563eb}
  .tab[data-t="admin"] .dot{background:#0f766e}
  .tab[data-t="mail"] .dot{background:#98a2b3}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--text); border-bottom-color:var(--text)}
  .who{margin-left:auto; display:flex; align-items:center; gap:9px; color:var(--text-2); font-size:13px}
  .who .av{width:28px; height:28px; border-radius:50%; background:var(--accent-weak); color:var(--accent); display:grid; place-items:center; font-weight:700; font-size:12px}

  .wrap{max-width:1120px; margin:0 auto; padding:24px 22px 80px}
  .console-edms{--accent:#2563eb; --accent-weak:#eef3ff}
  .console-admin{--accent:#0f766e; --accent-weak:#e6f4f1}
  .screen{animation:fade .22s ease}
  @keyframes fade{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}

  .backlink{display:inline-flex; align-items:center; gap:6px; color:var(--text-2); font-size:13px; font-weight:600; background:none; border:0; padding:5px 0; margin-bottom:2px}
  .backlink:hover{color:var(--text)}
  .backlink svg{width:15px; height:15px}
  .crumb{color:var(--text-3); font-size:12.5px; margin-bottom:8px; display:flex; align-items:center; gap:7px; flex-wrap:wrap}
  .crumb .pill{font-weight:700; color:#fff; padding:1px 8px; border-radius:5px; font-size:11px}
  .crumb .pill.edms{background:#2563eb}
  .crumb .pill.admin{background:#0f766e}
  .pagehead{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:20px}
  .pagehead h1{font-size:21px; letter-spacing:-.5px; display:flex; align-items:center; gap:11px}
  .pagehead .desc{color:var(--text-2); font-size:13px; margin-top:6px; max-width:64ch}
  .pagehead .actions{display:flex; gap:8px; flex-wrap:wrap; flex:none}
  .page-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:20px; flex-wrap:wrap}
  .pager{display:flex; align-items:center; gap:12px; padding:12px 16px; border-top:1px solid var(--border); flex-wrap:wrap}
  .pager.plain{border-top:0; padding:14px 0 0}
  .pgsize select{border:1px solid var(--border-strong); border-radius:7px; padding:6px 10px; font-size:12.5px; font-family:inherit; background:var(--surface); color:var(--text); cursor:pointer}
  .pgnums{display:flex; align-items:center; gap:4px; margin-left:auto}
  .pgbtn{min-width:30px; height:30px; padding:0 8px; border:1px solid var(--border); background:var(--surface); border-radius:7px; font-size:12.5px; font-weight:600; color:var(--text-2)}
  .pgbtn:hover:not(:disabled){background:var(--surface-2); color:var(--text)}
  .pgbtn.on{background:var(--accent); border-color:var(--accent); color:#fff}
  .pgbtn:disabled{opacity:.4; cursor:not-allowed}
  .linkbtn{border:1px solid var(--border-strong); background:var(--surface); border-radius:7px; padding:7px 12px; font-size:12.5px; font-weight:600; color:var(--text); display:inline-flex; align-items:center; gap:7px}
  .linkbtn:hover{background:var(--surface-2); border-color:var(--text-3)}
  .linkbtn svg{width:14px; height:14px}

  .btn{border:1px solid var(--border-strong); background:var(--surface); color:var(--text); border-radius:var(--radius-sm); padding:9px 15px; font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:7px; letter-spacing:-.2px; transition:background .12s, border-color .12s}
  .btn:hover{background:var(--surface-2); border-color:var(--text-3)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn.primary:hover{filter:brightness(.94)}
  .btn.ghost{border-color:transparent; background:transparent; color:var(--text-2); padding:7px 10px}
  .btn.ghost:hover{background:var(--surface-2); color:var(--text)}
  .btn.danger{color:var(--st-fail-tx); border-color:#f2c9c5}
  .btn.danger:hover{background:#fdecec; border-color:#e79a93}
  .btn.sm{padding:6px 11px; font-size:12.5px}
  .btn:disabled{opacity:.5; cursor:not-allowed}
  .btn svg{width:15px; height:15px}

  .toolbar{display:flex; align-items:center; gap:10px; margin-bottom:14px}
  .seg{display:inline-flex; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:3px; gap:2px; flex-wrap:wrap}
  .seg button{border:0; background:transparent; padding:6px 12px; border-radius:6px; font-size:12.5px; font-weight:600; color:var(--text-2)}
  .seg button.on{background:var(--accent-weak); color:var(--accent)}
  .search{margin-left:auto; position:relative}
  .search input{border:1px solid var(--border); border-radius:8px; padding:8px 12px 8px 32px; font-size:13px; width:220px; background:var(--surface)}
  .search input:focus{outline:2px solid var(--accent-weak); border-color:var(--accent)}
  .search svg{position:absolute; left:10px; top:9px; width:15px; height:15px; color:var(--text-3)}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden}
  .tbl-scroll{overflow-x:auto}
  table.list{width:100%; border-collapse:collapse; min-width:720px}
  .list thead th{text-align:left; font-size:12px; font-weight:600; color:var(--text-3); padding:12px 16px; background:var(--surface-2); border-bottom:1px solid var(--border); white-space:nowrap}
  .list tbody td{padding:13px 16px; border-bottom:1px solid var(--border); vertical-align:middle; font-size:13.5px}
  .list tbody tr:last-child td{border-bottom:0}
  .list tbody tr.click{transition:background .1s}
  .list tbody tr.click:hover{background:var(--surface-2); cursor:pointer}
  .t-title{font-weight:600; letter-spacing:-.2px}
  .t-id{color:var(--text-3); font-size:11.5px; margin-top:2px}
  .t-mono{color:var(--text-2); font-size:12.5px}
  td.right{text-align:right}

  .badge{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:600; white-space:nowrap}
  .badge::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.85}
  .badge.lg{font-size:13px; padding:5px 13px}
  .b-접수{background:var(--st-recv-bg); color:var(--st-recv-tx)}
  .b-처리중{background:var(--st-proc-bg); color:var(--st-proc-tx)}
  .b-처리완료{background:var(--st-done-bg); color:var(--st-done-tx)}
  .b-처리실패{background:var(--st-fail-bg); color:var(--st-fail-tx)}
  .b-재확인요청{background:var(--st-recheck-bg); color:var(--st-recheck-tx)}
  .b-취소{background:var(--st-cancel-bg); color:var(--st-cancel-tx)}

  .empty{padding:56px 20px; text-align:center; color:var(--text-3)}
  .empty h3{font-size:15px; color:var(--text-2); margin-bottom:6px; font-weight:600}

  .section{padding:20px 22px; border-bottom:1px solid var(--border)}
  .section:last-child{border-bottom:0}
  .section-t{font-size:12px; font-weight:700; color:var(--text-3); margin-bottom:12px; display:flex; align-items:center; gap:8px}
  .section-t .cnt{background:var(--surface-2); border:1px solid var(--border); color:var(--text-2); border-radius:20px; padding:1px 8px; font-size:11px}

  .kv{display:grid; grid-template-columns:130px 1fr; gap:11px 16px; font-size:13.5px}
  .kv dt{color:var(--text-3); font-weight:500}
  .kv dd{margin:0; color:var(--text)}

  .field{margin-bottom:18px}
  .field:last-child{margin-bottom:0}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--text-2); margin-bottom:6px}
  .field label .req{color:var(--st-fail-tx); margin-left:3px}
  .field input[type=text]{width:100%; border:1px solid var(--border-strong); border-radius:8px; padding:10px 12px; font-size:13.5px}
  .field input:focus, textarea:focus{outline:2px solid var(--accent-weak); border-color:var(--accent)}
  textarea{width:100%; border:1px solid var(--border-strong); border-radius:8px; padding:10px 12px; font-size:13.5px; font-family:inherit; resize:vertical; min-height:88px}

  .drop{border:1.5px dashed var(--border-strong); border-radius:10px; padding:22px; text-align:center; background:var(--surface-2)}
  .drop .fx{width:38px; height:38px; border-radius:9px; background:var(--accent-weak); color:var(--accent); display:grid; place-items:center; margin:0 auto 10px}
  .drop p{color:var(--text-2); font-size:13px}
  .drop .hint{color:var(--text-3); font-size:11.5px; margin-top:3px}
  .sim{display:flex; gap:8px; justify-content:center; margin-top:14px; flex-wrap:wrap}

  .note{border:1px solid var(--border); border-radius:9px; padding:12px 14px; font-size:12.5px; color:var(--text-2); background:var(--surface-2)}
  .note.blue{background:var(--accent-weak); border-color:transparent; color:var(--accent)}

  .result{border-radius:10px; padding:14px 16px; margin-top:16px; font-size:13px; display:flex; gap:11px; align-items:flex-start}
  .result.ok{background:var(--st-done-bg); color:var(--st-done-tx)}
  .result.bad{background:var(--st-fail-bg); color:var(--st-fail-tx)}
  .result .ico{flex:none; width:20px; height:20px; margin-top:1px}
  .result b{font-weight:700}

  .mini{width:100%; border-collapse:collapse; border:1px solid var(--border); border-radius:9px; overflow:hidden}
  .mini th{font-size:11px; padding:9px 12px; background:var(--surface-2); color:var(--text-3); border-bottom:1px solid var(--border); text-align:left; white-space:nowrap}
  .mini td{font-size:12.5px; padding:9px 12px; border-bottom:1px solid var(--border); color:var(--text)}
  .mini tr:last-child td{border-bottom:0}
  .mini td.fail{color:var(--st-fail-tx)}
  .mini .rowfail{background:#fef6f5}
  .mono{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}

  .proc{display:flex; align-items:center; gap:12px; padding:18px 20px; background:var(--st-proc-bg); border-radius:10px; color:var(--st-proc-tx); font-weight:600; font-size:13.5px}
  .spin{width:20px; height:20px; border:2.5px solid rgba(180,83,9,.25); border-top-color:var(--st-proc-tx); border-radius:50%; animation:spin .7s linear infinite; flex:none}
  @keyframes spin{to{transform:rotate(360deg)}}

  .inline-panel{border:1px solid var(--border); border-radius:10px; padding:16px; margin-top:4px; background:var(--surface-2)}
  .inline-panel h4{font-size:13.5px; margin-bottom:10px}
  .inline-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:12px; flex-wrap:wrap}
  .err{color:var(--st-fail-tx); font-size:12.5px; margin-top:6px}

  .confirm{border:1px solid #f2c9c5; background:#fef6f5; border-radius:10px; padding:14px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .confirm p{color:var(--st-fail-tx); font-size:13px; font-weight:500}
  .confirm .sp{margin-left:auto; display:flex; gap:8px}

  .mailwrap{max-width:760px}
  .mail-empty{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:40px 32px; box-shadow:var(--shadow)}
  .mail-empty .tag{display:inline-block; font-size:11.5px; font-weight:700; color:#98a2b3; border:1px solid var(--border); border-radius:20px; padding:3px 11px; margin-bottom:14px}
  .mail-empty h2{font-size:19px; letter-spacing:-.4px}
  .mail-empty p{color:var(--text-2); font-size:13.5px; margin-top:8px; max-width:56ch}

  .guide{color:var(--text-2); font-size:13px; margin-top:9px; display:flex; flex-direction:column; gap:5px; max-width:72ch}
  .guide span{display:flex; gap:7px}
  .cf-overlay{position:fixed; inset:0; background:rgba(23,26,31,.42); display:none; align-items:center; justify-content:center; padding:20px; z-index:90}
  .cf-overlay.on{display:flex}
  .cf-box{background:var(--surface); border-radius:14px; box-shadow:0 20px 60px rgba(16,24,40,.28); max-width:410px; width:100%; padding:24px; animation:pop .18s ease}
  @keyframes pop{from{opacity:0; transform:scale(.98)} to{opacity:1; transform:none}}
  .cf-box p{font-size:14px; color:var(--text); line-height:1.65}
  .cf-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:20px}

  .toasts{position:fixed; right:22px; bottom:22px; display:flex; flex-direction:column; gap:9px; z-index:80}
  .toast{background:#171a1f; color:#fff; padding:11px 15px; border-radius:9px; font-size:13px; font-weight:500; box-shadow:0 10px 30px rgba(0,0,0,.22); display:flex; align-items:center; gap:9px; animation:slidein .22s ease; max-width:340px}
  .toast .ic{width:16px; height:16px; flex:none}
  .toast.mail{background:#1e3a5f}
  @keyframes slidein{from{opacity:0; transform:translateX(10px)} to{opacity:1; transform:none}}

  @media(max-width:640px){
    .appbar{gap:12px; padding:0 12px; overflow-x:auto}
    .brand .sub{display:none}
    .wrap{padding:18px 12px 60px}
    .pagehead{flex-direction:column}
    .kv{grid-template-columns:1fr}
    .kv dt{color:var(--text-3); margin-bottom:-6px}
  }
</style>
</head>

/* ============ List helpers ============ */
function visibleRows(scope){
  const f=filters[scope], q=searches[scope];
  return store.filter(s=>{
    const shown = scope==='edms' ? edmsStatus(s.status) : s.status;
    if(f!=='all' && shown!==f) return false;
    if(q){
      const hay = scope==='edms' ? s.title : (s.title+' '+s.author);
      if(!hay.toLowerCase().includes(q.toLowerCase())) return false;
    }
    return true;
  });
}
/* ============ Paging (common policy) ============ */
const PAGE_SIZES = [30,50,100,200];
const pageState = { edms:{page:1,size:50}, admin:{page:1,size:50}, detail:{page:1,size:50} };
function pagerHtml(scope, total){
  const st=pageState[scope];
  const pages=Math.max(1, Math.ceil(total/st.size));
  if(st.page>pages) st.page=pages;
  let startP=Math.max(1, st.page-2), endP=Math.min(pages, startP+4);
  startP=Math.max(1, endP-4);
  let nums='';
  for(let p=startP;p<=endP;p++) nums+=`<button class="pgbtn ${p===st.page?'on':''}" onclick="gotoPage('${scope}',${p})">${p}</button>`;
  const opts=PAGE_SIZES.map(n=>`<option value="${n}" ${n===st.size?'selected':''}>${n}개씩 보기</option>`).join('');
  return `<div class="pgsize"><select onchange="setPageSize('${scope}',this.value)">${opts}</select></div>
    <div class="pgnums">
      <button class="pgbtn" ${st.page<=1?'disabled':''} onclick="gotoPage('${scope}',${st.page-1})" aria-label="이전">＜</button>
      ${nums}
      <button class="pgbtn" ${st.page>=pages?'disabled':''} onclick="gotoPage('${scope}',${st.page+1})" aria-label="다음">＞</button>
    </div>`;
}
function pagedSlice(all, scope){ const st=pageState[scope]; const start=(st.page-1)*st.size; return all.slice(start, start+st.size); }
function refreshList(scope){
  document.getElementById(scope+'-rows').innerHTML = listBody(scope);
  document.getElementById(scope+'-pager').innerHTML = pagerHtml(scope, visibleRows(scope).length);
}
function gotoPage(scope, p){
  pageState[scope].page = p;
  if(scope==='detail'){ rerender(); scrollToRows(); return; }
  refreshList(scope);
  const c=document.getElementById(scope+'-rows'); if(c){ const card=c.closest('.card'); if(card) card.scrollIntoView({block:'start'}); }
}
function setPageSize(scope, v){ pageState[scope].size=parseInt(v,10); pageState[scope].page=1; if(scope==='detail') rerender(); else refreshList(scope); }
function scrollToRows(){ const el=document.getElementById('detail-rows'); if(el) el.scrollIntoView({block:'start'}); }

function listBody(scope){
  const all=visibleRows(scope);
  if(!all.length) return `<tr><td colspan="${scope==='edms'?4:5}"><div class="empty"><h3>표시할 항목이 없습니다</h3>조건에 맞는 접수 건이 없습니다.</div></td></tr>`;
  const rows=pagedSlice(all, scope);
  if(scope==='edms') return rows.map(s=>`
    <tr class="click" onclick="go('edms','detail','${s.id}')">
      <td><div class="t-title">${esc(s.title)}</div></td>
      <td>${badge(edmsStatus(s.status))}</td>
      <td>${esc(s.author)}</td>
      <td class="t-mono mono">${s.createdAt}</td>
    </tr>`).join('');
  return rows.map(s=>`
    <tr class="click" onclick="go('admin','detail','${s.id}')">
      <td><div class="t-title">${esc(s.title)}</div><div class="t-id mono">${s.id} · 대상 ${s.rows.length}건</div></td>
      <td>${badge(s.status)}</td>
      <td>${esc(s.author)}<div class="t-id">${esc(s.authorEmail)}</div></td>
      <td class="t-mono mono">${s.createdAt}</td>
      <td class="right"><button class="btn sm ghost" onclick="event.stopPropagation();go('admin','detail','${s.id}')">상세</button></td>
    </tr>`).join('');
}
function setFilter(scope,f,el){ filters[scope]=f; pageState[scope].page=1; el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el)); refreshList(scope); }
function setSearch(scope,v){ searches[scope]=v.trim(); pageState[scope].page=1; refreshList(scope); }

function segHtml(scope, opts){
  return `<div class="seg">${opts.map((o,i)=>`<button class="${i===0?'on':''}" data-f="${o}" onclick="setFilter('${scope}','${o==='전체'?'all':o}',this)">${o}</button>`).join('')}</div>`;
}

/* ============ ADMIN detail (page) ============ */
function viewAdminDetail(id){
  const s=find(id); if(!s) return viewAdminList();
  const showFail=(s.status==='처리실패'||s.status==='처리완료');
  let actions='';
  if(s.status==='접수'){
    actions=`<button class="btn danger" onclick="askCancel('${s.id}')">취소</button>
      <button class="btn" onclick="ui.recheckOpen=true;rerender()">재확인요청</button>
      <button class="btn primary" onclick="approve('${s.id}')">승인 (입과 실행)</button>`;
  } else if(s.status==='처리실패'){
    actions=`<button class="btn" onclick="ui.recheckOpen=true;rerender()">재확인요청</button>
      <button class="btn" onclick="finalize('${s.id}')">종결 처리</button>
      <button class="btn primary" onclick="rerun('${s.id}')">재실행 (실패 행만)</button>`;
  } else if(s.status==='재확인요청'){
    actions=`<button class="btn danger" onclick="askCancel('${s.id}')">취소</button>`;
  }
  let banner='';
  if(s.status==='처리중') banner=`<div class="section"><div class="proc"><span class="spin"></span> 입과 처리 중입니다…</div></div>`;
  else if(s.status==='접수') banner=`<div class="section"><div class="note blue">승인하면 입과 처리가 즉시 실행됩니다. 데이터 확인이 필요하면 재확인요청을 보내세요.</div></div>`;
  else if(s.status==='재확인요청') banner=`<div class="section"><div class="note">교육담당자의 수정·재제출을 기다리는 상태입니다.</div></div>`;

  const bottom = ui.recheckOpen ? recheckPanelHtml(s.id)
               : (actions ? `<div class="page-actions">${actions}</div>` : '');

  return `<div class="screen">
    <button class="backlink" onclick="go('admin','list')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>목록으로</button>
    <div class="crumb"><span class="pill admin">Admin</span> 단체 수강신청 접수 <span>›</span> 상세</div>
    <div class="pagehead">
      <div><h1>${esc(s.title)} ${badge(s.status,true)}</h1></div>
    </div>
    <div class="card">
      <div class="section">
        <dl class="kv">
          <dt>상태</dt><dd>${badge(s.status)}</dd>
          <dt>작성자</dt><dd>${esc(s.author)} <span class="t-id mono">(${esc(s.authorEmail)})</span></dd>
          <dt>접수일</dt><dd class="mono">${s.createdAt}</dd>
          <dt>대상 건수</dt><dd>${s.rows.length}건${s.status==='처리실패'?` · <span style="color:var(--st-fail-tx);font-weight:600">실패 ${s.rows.filter(r=>r.fail).length}건</span>`:''}</dd>
          <dt>신청서 파일</dt><dd>${fileBtn(s)}</dd>
        </dl>
      </div>
      ${s.status==='재확인요청'&&s.requestNote?`<div class="section"><div class="section-t">요청 내용</div><div class="note">${esc(s.requestNote)}</div></div>`:''}
      ${banner}
      <div class="section"><div class="section-t">신청 대상 <span class="cnt">${s.rows.length}</span></div>${rowsTable(s,showFail)}</div>
    </div>
    ${bottom}
  </div>`;
}

function recheckPanelHtml(id){
  return `<div class="inline-panel" style="margin-top:20px">
    <h4>재확인요청</h4>
    <div class="field" style="margin:0"><label>요청 내용 <span class="req">*</span></label>
      <textarea id="recheckNote" placeholder="예) 5행 학습종료일이 계약종료일을 초과합니다. 기간 수정 후 재제출 부탁드립니다." oninput="ui.recheckNote=this.value">${esc(ui.recheckNote)}</textarea>
      ${ui.recheckErr?'<div class="err">요청 내용을 입력해 주세요.</div>':''}
      <div class="note" style="margin-top:10px">재확인요청 시 교육담당자에게 재확인요청 안내 메일이 발송됩니다.</div>
    </div>
    <div class="inline-actions">
      <button class="btn sm" onclick="ui.recheckOpen=false;ui.recheckErr=false;rerender()">닫기</button>
      <button class="btn sm primary" onclick="sendRecheck('${id}')">재확인요청 보내기</button>
    </div>
  </div>`;
}

function approve(id){
  const s=find(id); if(!s)return;
  s.status='처리중'; rerender();
  setTimeout(()=>{
    if(s.outcome==='partial'){
      s.status='처리실패';
      if(!s.rows.some(r=>r.fail)&&s.rows.length>1) s.rows[s.rows.length-1].fail='이미 입과된 이력이 있습니다. (중복 입과 불가)';
      toast('일부 행이 실패하여 처리실패로 전환되었습니다','bad');
      toast('운영자에게 처리실패 알림 메일 발송','mail');
    } else {
      s.status='처리완료'; s.rows.forEach(r=>delete r.fail);
      toast('입과 처리가 완료되었습니다','ok');
      toast('교육담당자에게 처리완료 안내 메일 발송','mail');
    }
    if(view.tab==='admin'&&view.screen==='detail'&&view.id===id) rerender();
  },1400);
}
function rerun(id){
  const s=find(id); if(!s)return;
  s.status='처리중'; rerender();
  setTimeout(()=>{
    s.rows.forEach(r=>delete r.fail); s.status='처리완료';
    toast('실패 행 재실행이 완료되어 처리완료되었습니다','ok');
    toast('교육담당자에게 처리완료 안내 메일 발송','mail');
    if(view.tab==='admin'&&view.screen==='detail'&&view.id===id) rerender();
  },1400);
}
function finalize(id){
  const s=find(id); if(!s)return;
  s.status='처리완료';
  toast('운영자 종결로 처리완료되었습니다','ok');
  toast('교육담당자에게 처리완료 안내 메일 발송','mail');
  rerender();
}
function sendRecheck(id){
  const s=find(id); if(!s)return;
  const v=(ui.recheckNote||'').trim();
  if(!v){ ui.recheckErr=true; rerender(); return; }
  s.status='재확인요청'; s.requestNote=v;
  ui.recheckOpen=false; ui.recheckErr=false;
  toast('재확인요청을 보냈습니다','ok');
  toast('교육담당자에게 재확인요청 안내 메일 발송','mail');
  rerender();
}
function confirmCancel(id){
  const s=find(id); if(!s)return;
  s.status='취소';
  const back=view.tab;
  go(back,'list');
  toast('접수가 취소되었습니다','plain');
}

function downloadBytes(b64, name){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  const blob = new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function downloadTemplate(){ downloadBytes(TEMPLATE_B64, TEMPLATE_NAME); toast('양식을 다운로드했습니다','plain'); }
function downloadSubmissionFile(id){ downloadBytes(TEMPLATE_B64, id+'_신청서.xlsx'); toast('신청서 파일을 다운로드했습니다','plain'); }
function fileBtn(s){ return `<button class="linkbtn" onclick="downloadSubmissionFile('${s.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>${s.id}_신청서.xlsx</button>`; }

/* ============ Toast ============ */
function toast(msg, kind){
  const el=document.createElement('div');
  el.className='toast'+(kind==='mail'?' mail':'');
  const ic = kind==='mail'
    ? '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>'
    : kind==='bad'
    ? '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#ff8a80" stroke-width="2.2" stroke-linecap="round"><path d="M12 8v5M12 16.5v.3"/><circle cx="12" cy="12" r="9"/></svg>'
    : kind==='ok'
    ? '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#7ee2a8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'
    : '';
  el.innerHTML=ic+`<span>${esc(msg)}</span>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s, transform .3s'; el.style.opacity='0'; el.style.transform='translateX(10px)'; setTimeout(()=>el.remove(),300); }, kind==='mail'?2600:2800);
}

/* ============ Leave-guard confirm ============ */
function isCreateDirty(){
  const fileDirty = !!(ui.intake && ui.intake!=='idle');
  if(view.id){ const s=find(view.id); const titleChanged = s && (ui.intakeTitle||'').trim()!==s.title; return !!(fileDirty || titleChanged); }
  return !!((ui.intakeTitle && ui.intakeTitle.trim()) || fileDirty);
}
function cancelCreate(){
  if(isCreateDirty()) showConfirm('취소 시 작성한 내용은 모두 사라지고, 복원할 수 없습니다. 이대로 나가시겠습니까?', ()=>go('edms','list'), '나가기','머무르기');
  else go('edms','list');
}
function showConfirm(msg, onYes, yesLabel, noLabel, danger){
  document.getElementById('cfMsg').textContent = msg;
  const yes=document.getElementById('cfYes'), no=document.getElementById('cfNo');
  yes.textContent=yesLabel||'확인'; no.textContent=noLabel||'취소';
  yes.className = danger ? 'btn danger' : 'btn';
  no.className = 'btn primary';
  yes.onclick=()=>{ hideConfirm(); onYes&&onYes(); };
  no.onclick=hideConfirm;
  document.getElementById('cfOverlay').classList.add('on');
}
function askCancel(id){
  showConfirm('이 접수 건을 취소하시겠습니까? 취소된 건은 되돌릴 수 없으며, 다시 진행하려면 신규로 접수해야 합니다.', ()=>confirmCancel(id), '접수 취소', '닫기', true);
}
function hideConfirm(){ document.getElementById('cfOverlay').classList.remove('on'); }

/* ============ init ============ */
go('edms','list');
</script>
